<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%236b7280' d='M18.6 6.62c-1.44 0-2.8.56-3.77 1.53L7.8 14.39c-.64.64-1.49.99-2.4.99C3.53 15.38 2 13.87 2 12s1.53-3.38 3.4-3.38c.91 0 1.76.35 2.44 1.03l1.13 1l1.53-1.34L9.22 8.2A5.37 5.37 0 0 0 5.4 6.62C2.42 6.62 0 9.04 0 12s2.42 5.38 5.4 5.38c1.44 0 2.8-.56 3.77-1.53l7.03-6.24c.64-.64 1.49-.99 2.4-.99c1.87 0 3.4 1.51 3.4 3.38s-1.53 3.38-3.4 3.38c-.9 0-1.76-.35-2.44-1.03L15 13.34l-1.5 1.34l1.28 1.12a5.4 5.4 0 0 0 3.82 1.58c2.98 0 5.4-2.42 5.4-5.38s-2.42-5.38-5.4-5.38'/></svg>"
    />

    <script src="theme-boot.js"></script>
    <script src="main.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        background: #faf9f5;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #141413;
        }
      }

      :root {
        --bg-primary: linear-gradient(180deg, #faf9f5 0%, #f5f4ed 100%);
        --bg-card: rgba(250, 249, 245, var(--opacity-light, 0.85));
        --text-primary: #141413;
        --text-secondary: #30302e;
        --text-muted: #5e5d59;
        --border-color: #d8d5cc;
        --border-strong: #b0aea5;
        --shadow: rgba(20, 20, 19, 0.08);
        --accent: #141413;
        --accent-hover: #30302e;
        --accent-contrast: #faf9f5;
        --accent-muted: rgba(20, 20, 19, 0.08);
        --surface-elevated: #faf9f5;
        --surface-input: var(--bg-card);
        --surface-secondary: rgba(176, 174, 165, 0.18);
        --surface-secondary-hover: rgba(176, 174, 165, 0.28);
        --surface-preview: rgba(245, 244, 237, 0.88);
        --surface-preview-text: #5e5d59;
        --control-border: #b0aea5;
        --control-muted: #77756f;
        --status-muted: #77756f;
        --danger: #e74c3c;
        --danger-contrast: #fff;
        --delete-border: #f5f4ed;
        --opacity-light: 0.85;
        --opacity-dark: 0.85;
        --font-claude-like:
          ui-serif, Georgia, Cambria, 'Times New Roman', 'LXGW WenKai', 'Songti SC', STSong,
          'Noto Serif CJK SC', 'Source Han Serif SC', serif;
      }

      [data-theme='dark'] {
        --bg-primary: linear-gradient(180deg, #1a1918 0%, #141413 100%);
        --bg-card: rgba(31, 30, 29, var(--opacity-dark, 0.85));
        --text-primary: #faf9f5;
        --text-secondary: #d8d5cc;
        --text-muted: #b0aea5;
        --border-color: rgba(176, 174, 165, 0.16);
        --border-strong: rgba(201, 184, 159, 0.24);
        --shadow: rgba(5, 5, 4, 0.5);
        --accent: #c9b89f;
        --accent-hover: #d5c8b4;
        --accent-contrast: #141413;
        --accent-muted: rgba(201, 184, 159, 0.13);
        --surface-elevated: rgba(38, 38, 36, 0.96);
        --surface-input: rgba(250, 249, 245, 0.06);
        --surface-secondary: rgba(94, 93, 89, 0.14);
        --surface-secondary-hover: rgba(94, 93, 89, 0.22);
        --surface-preview: rgba(250, 249, 245, 0.07);
        --surface-preview-text: #d0ccc1;
        --control-border: rgba(176, 174, 165, 0.28);
        --control-muted: #b0aea5;
        --status-muted: var(--text-muted);
        --danger: #c9877b;
        --danger-contrast: #141413;
        --delete-border: #30302e;
      }

      body {
        min-height: 100vh;
        background: var(--bg-primary);
        font-family: var(--font-claude-like);
        font-feature-settings: 'kern';
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        color: var(--text-primary);
        padding: 0 80px;
        padding-top: 9vh;
      }

      button,
      input {
        font: inherit;
      }

      body.has-bg {
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #141413;
      }

      /* 搜索框 */
      .search-box {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--bg-card);
        border-radius: 50px;
        padding: 14px 14px 14px 20px;
        box-shadow: 0 2px 12px var(--shadow);
        max-width: 840px;
        margin: 0 auto 45px;
      }

      .search-engines {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-right: 18px;
        border-right: 1px solid var(--border-color);
        margin-right: 18px;
      }

      .search-engine {
        width: 26px;
        height: 26px;
        cursor: pointer;
        opacity: 0.4;
        transition: opacity 0.2s;
        border-radius: 4px;
      }

      .search-engine:hover,
      .search-engine.active {
        opacity: 1;
      }

      .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 15px;
        color: var(--text-primary);
        background: transparent;
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-btn {
        width: 48px;
        height: 48px;
        background: var(--accent);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        flex-shrink: 0;
      }

      .search-btn:hover {
        background: var(--accent-hover);
      }

      .search-btn svg {
        width: 20px;
        height: 20px;
        fill: var(--accent-contrast);
      }

      /* 搜索建议 */
      .suggestions-container {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        background: var(--surface-elevated);
        border-radius: 16px;
        box-shadow:
          0 16px 42px var(--shadow),
          0 0 0 1px var(--border-color);
        overflow: hidden;
        z-index: 50;
      }

      [data-theme='dark'] .suggestions-container {
        background: var(--surface-elevated);
        box-shadow:
          0 18px 45px var(--shadow),
          0 0 0 1px var(--border-color);
      }

      .suggestion-item {
        padding: 12px 20px;
        cursor: pointer;
        font-size: 14px;
        color: var(--text-primary);
        transition: background 0.15s;
      }

      [data-theme='dark'] .suggestion-item {
        color: var(--text-secondary);
      }

      .suggestion-item:hover,
      .suggestion-item.active {
        background: var(--accent-muted);
      }

      [data-theme='dark'] .suggestion-item:hover,
      [data-theme='dark'] .suggestion-item.active {
        background: var(--accent-muted);
      }

      /* 分组区域 */
      .group-section {
        margin-bottom: 28px;
      }

      .group-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        position: relative;
      }

      .group-indicator {
        width: 4px;
        height: 18px;
        background: var(--accent);
        border-radius: 2px;
      }

      .group-icon {
        font-size: 16px;
      }

      .group-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .group-edit-icon {
        background: none;
        border: none;
        font-size: 14px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px 6px;
        margin-left: 4px;
        border-radius: 4px;
        opacity: 0;
        transition: all 0.15s;
      }

      .group-header:hover .group-edit-icon {
        opacity: 1;
      }

      .group-edit-icon:hover {
        color: var(--accent);
        background: var(--accent-muted);
      }

      .group-actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }

      .group-section:hover .group-actions {
        opacity: 1;
      }

      .group-action-btn {
        background: var(--surface-secondary);
        border: none;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
      }

      [data-theme='dark'] .group-action-btn {
        background: var(--surface-secondary);
        color: var(--text-muted);
      }

      .group-action-btn:hover {
        background: var(--surface-secondary-hover);
        color: var(--text-secondary);
      }

      [data-theme='dark'] .group-action-btn:hover {
        background: var(--surface-secondary-hover);
        color: var(--text-secondary);
      }

      .group-action-btn.editing {
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .group-action-btn.editing:hover {
        background: var(--accent-hover);
      }

      .delete-group-btn {
        display: none;
      }

      .group-section.editing .delete-group-btn {
        display: block;
      }

      .group-section.editing .edit-group-btn {
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .group-section.editing .edit-group-btn:hover {
        background: var(--accent-hover);
      }

      /* 链接列表 - 横向排列 */
      .links-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .link-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-card);
        border-radius: 10px;
        padding: 12px 20px;
        text-decoration: none;
        color: var(--text-primary);
        min-width: 160px;
        box-shadow: 0 1px 4px var(--shadow);
        transition: all 0.15s ease;
        position: relative;
      }

      .link-card:hover {
        box-shadow: 0 4px 12px var(--shadow);
        transform: translateY(-1px);
      }

      .link-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .link-icon img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        object-fit: contain;
      }

      .link-icon.fallback {
        background: var(--border-color);
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .link-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      /* 链接编辑图标 */
      .link-edit-icon {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        opacity: 0;
        transition: all 0.15s;
      }

      .link-card:hover .link-edit-icon {
        opacity: 1;
      }

      .link-edit-icon:hover {
        color: var(--accent);
        background: var(--accent-muted);
      }

      .link-delete {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 18px;
        height: 18px;
        background: var(--danger);
        border: 2px solid var(--delete-border);
        border-radius: 50%;
        color: var(--danger-contrast);
        font-size: 10px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .group-section.editing .link-delete {
        display: flex;
      }

      /* 添加按钮 */
      .add-link-btn {
        display: none;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1.5px dashed var(--control-border);
        border-radius: 10px;
        padding: 12px 24px;
        min-width: 80px;
        cursor: pointer;
        color: var(--control-muted);
        font-size: 18px;
        transition: all 0.15s;
      }

      .group-section.editing .add-link-btn {
        display: flex;
      }

      .add-link-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* 添加分组按钮 */
      .add-group-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1.5px dashed var(--control-border);
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 10px;
      }

      .add-group-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* 拖拽样式 */
      .group-section.editing .link-card {
        cursor: grab;
      }

      .group-section.editing .link-card:active {
        cursor: grabbing;
      }

      .link-card.dragging {
        opacity: 0.5;
        transform: scale(1.02);
      }

      .link-card.drag-over {
        border: 2px dashed var(--accent);
      }

      .group-section.link-drop-target .links-row {
        min-height: 54px;
        border-radius: 10px;
      }

      .links-row.drag-over-row {
        outline: 2px dashed var(--accent);
        outline-offset: 4px;
      }

      /* 分组拖拽样式 */
      .group-section.dragging-group {
        opacity: 0.5;
      }

      .group-section.drag-over-group {
        border-top: 2px dashed var(--accent);
        padding-top: 10px;
      }

      /* 设置按钮 */
      .settings-btn {
        position: fixed;
        top: 20px;
        right: 24px;
        background: var(--bg-card);
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        font-size: 16px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px var(--shadow);
      }

      .settings-btn:hover {
        color: var(--text-secondary);
      }

      /* 暗黑模式切换 */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 70px;
        background: var(--bg-card);
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        font-size: 16px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px var(--shadow);
      }

      .theme-toggle:hover {
        color: var(--text-secondary);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 400px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow:
          0 24px 70px var(--shadow),
          0 0 0 1px var(--border-color);
      }

      [data-theme='dark'] .modal-content {
        background: var(--surface-elevated);
        box-shadow:
          0 24px 70px var(--shadow),
          0 0 0 1px var(--border-color);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .modal-title {
        font-size: 17px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: var(--text-muted);
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
      }

      .close-btn:hover {
        background: var(--border-color);
        color: var(--text-secondary);
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        color: var(--text-primary);
        background: var(--bg-card);
      }

      [data-theme='dark'] .form-group input,
      [data-theme='dark'] .form-group select {
        background: var(--surface-input);
        border-color: var(--border-color);
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-muted);
      }

      .form-group input::placeholder {
        color: var(--text-muted);
      }

      .icon-preview {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--surface-preview);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-top: 8px;
      }

      .icon-preview img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        object-fit: contain;
      }

      .icon-preview span {
        font-size: 13px;
        color: var(--surface-preview-text);
      }

      .btn {
        padding: 11px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--surface-secondary);
        color: var(--text-secondary);
      }

      .btn-secondary:hover {
        background: var(--surface-secondary-hover);
      }

      [data-theme='dark'] .btn-secondary {
        color: var(--text-secondary);
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .btn-group .btn {
        flex: 1;
      }

      .settings-section {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      .settings-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .settings-section-title {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .settings-btns {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      @media (max-width: 600px) {
        body {
          padding: 0 20px;
          padding-top: 8vh;
        }

        .search-box {
          max-width: none;
          padding: 12px;
          margin-bottom: 36px;
        }

        .search-engines {
          gap: 8px;
          padding-right: 10px;
          margin-right: 10px;
        }

        .search-engine {
          width: 22px;
          height: 22px;
        }

        .search-input {
          min-width: 0;
          font-size: 14px;
        }

        .search-btn {
          width: 44px;
          height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" title="切换暗黑模式">🌙</button>
    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <div class="search-box">
      <div class="search-engines">
        <img
          class="search-engine active"
          data-engine="google"
          data-icon-url="https://www.google.com"
          alt="Google"
          title="Google"
        />
        <img
          class="search-engine"
          data-engine="bing"
          data-icon-url="https://www.bing.com"
          alt="Bing"
          title="Bing"
        />
        <img
          class="search-engine"
          data-engine="baidu"
          data-icon-url="https://www.baidu.com"
          alt="百度"
          title="百度"
        />
      </div>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="使用 Google 搜索..."
        autocomplete="off"
      />
      <button class="search-btn" id="searchBtn">
        <svg viewBox="0 0 24 24">
          <path
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
          />
        </svg>
      </button>
      <div class="suggestions-container" id="suggestionsContainer"></div>
    </div>

    <div id="groupsContainer"></div>

    <button class="add-group-btn" id="addGroupBtn">+ 添加分组</button>

    <div class="modal" id="linkModal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="linkModalTitle">添加链接</span>
          <button class="close-btn" id="closeLinkModal">&times;</button>
        </div>
        <div class="form-group">
          <label>网址</label>
          <input type="text" id="linkUrl" placeholder="https://github.com" />
          <div class="icon-preview" id="linkPreview" style="display: none">
            <img id="linkPreviewIcon" src="" />
            <span id="linkPreviewDomain"></span>
          </div>
        </div>
        <div class="form-group">
          <label>名称 (可选)</label>
          <input type="text" id="linkName" placeholder="留空自动获取" />
        </div>
        <div class="form-group">
          <label>自定义图标 (可选)</label>
          <div style="display: flex; gap: 8px; align-items: center">
            <button
              class="btn btn-secondary"
              id="uploadIconBtn"
              style="padding: 8px 12px; font-size: 12px"
            >
              上传图标
            </button>
            <span id="customIconStatus" style="font-size: 12px; color: var(--status-muted)"
              >未选择</span
            >
          </div>
          <input type="file" id="iconFileInput" accept="image/*" style="display: none" />
          <div id="customIconPreview" style="display: none; margin-top: 8px">
            <img id="customIconImg" style="width: 32px; height: 32px; border-radius: 6px" />
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="saveLinkBtn">保存</button>
          <button class="btn btn-secondary" id="cancelLinkBtn">取消</button>
        </div>
      </div>
    </div>

    <div class="modal" id="groupModal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="groupModalTitle">添加分组</span>
          <button class="close-btn" id="closeGroupModal">&times;</button>
        </div>
        <div class="form-group">
          <label>分组名称</label>
          <input type="text" id="groupName" placeholder="开发工具" />
        </div>
        <div class="form-group">
          <label>图标 (emoji)</label>
          <input type="text" id="groupIcon" placeholder="💻" maxlength="2" />
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="saveGroupBtn">保存</button>
          <button class="btn btn-secondary" id="cancelGroupBtn">取消</button>
        </div>
      </div>
    </div>

    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title">设置</span>
          <button class="close-btn" id="closeSettingsModal">&times;</button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">外观</div>
          <div class="form-group">
            <label>卡片透明度 (亮色模式)</label>
            <input
              type="range"
              id="opacityLight"
              min="0"
              max="100"
              value="85"
              style="width: 100%"
            />
            <span id="opacityLightVal" style="font-size: 12px; color: var(--text-muted)">85%</span>
          </div>
          <div class="form-group">
            <label>卡片透明度 (暗色模式)</label>
            <input type="range" id="opacityDark" min="0" max="100" value="85" style="width: 100%" />
            <span id="opacityDarkVal" style="font-size: 12px; color: var(--text-muted)">85%</span>
          </div>
          <button class="btn btn-secondary" id="saveOpacityBtn" style="width: 100%">
            应用透明度
          </button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">背景</div>
          <div class="form-group" style="margin-bottom: 10px">
            <input type="text" id="bgUrl" placeholder="背景图片 URL (支持图床链接)" />
          </div>
          <button class="btn btn-secondary" id="saveBgBtn" style="width: 100%">应用背景</button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">WebDAV 云同步</div>
          <div class="form-group">
            <label>服务器地址</label>
            <input type="text" id="webdavUrl" placeholder="https://your-nas.com/webdav/newtab" />
          </div>
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="webdavUser" placeholder="用户名" />
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="webdavPass" placeholder="密码" />
          </div>
          <div class="btn-group" style="margin-top: 12px">
            <button class="btn btn-secondary" id="webdavSaveConfig">保存配置</button>
          </div>
          <div class="btn-group" style="margin-top: 8px">
            <button class="btn btn-primary" id="webdavUpload">↑ 上传</button>
            <button class="btn btn-secondary" id="webdavDownload">↓ 下载</button>
          </div>
          <div
            id="webdavStatus"
            style="font-size: 12px; color: var(--text-muted); margin-top: 8px"
          ></div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">本地数据</div>
          <div class="settings-btns">
            <button class="btn btn-secondary" id="exportBtn">📤 导出配置</button>
            <button class="btn btn-secondary" id="importBtn">📥 导入配置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="syncModal">
      <div class="modal-content" style="max-width: 320px">
        <div class="modal-header">
          <span class="modal-title">🔄 发现云端更新</span>
        </div>
        <p
          style="
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
          "
        >
          云端配置与本地不同，是否使用云端配置覆盖本地？
        </p>
        <div class="btn-group">
          <button class="btn btn-primary" id="syncApplyRemote">使用云端</button>
          <button class="btn btn-secondary" id="syncKeepLocal">保留本地</button>
        </div>
      </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display: none" />
  </body>
</html>
